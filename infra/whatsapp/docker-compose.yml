# Wuzapi (WhatsApp, MIT, whatsmeow) local, com SQLite em volume (não usa o Supabase compartilhado).
# Sobe com: pnpm whatsapp:up   (lê WUZAPI_* do .env da raiz). Só escuta em 127.0.0.1:8081.
# Sem imagem oficial publicada: compila do repositório num commit fixo (troque o hash para atualizar).
name: domus-whatsapp

services:
  wuzapi:
    build: https://github.com/asternic/wuzapi.git#358d312a30c61099dd4e9173b2dc88d545325159
    image: domus-wuzapi:358d312
    restart: unless-stopped
    ports: ["127.0.0.1:8081:8080"]
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:?defina WUZAPI_ADMIN_TOKEN no .env}
      WUZAPI_GLOBAL_ENCRYPTION_KEY: ${WUZAPI_ENCRYPTION_KEY:?defina WUZAPI_ENCRYPTION_KEY no .env}
      SESSION_DEVICE_NAME: DOMUS AdPilot
      TZ: America/Sao_Paulo
    volumes: [wuzapi-data:/app/dbdata]

volumes:
  wuzapi-data:
